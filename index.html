<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capibara Games - Próximamente</title>
    <style>
        /* Reset básico */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Color de fondo si falla la imagen */
            color: #ffffff;
        }

        /* Imagen de fondo con overlay oscuro */
        .bg-image {
            /* Usamos una imagen aleatoria de tecnología/gaming de Unsplash */
            background-image: url('https://source.unsplash.com/1920x1080/?technology,gaming,dark');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }

        /* Capa oscura encima de la imagen para que el texto se lea bien */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); /* Oscuridad al 75% */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Contenido central */
        .content {
            max-width: 600px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: #f39c12; /* Un color naranja/dorado para resaltar */
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.lead {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .divider {
            height: 3px;
            width: 100px;
            background-color: #f39c12;
            margin: 20px auto;
        }

        /* Animación suave de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p.lead { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="overlay">
            <div class="content">
                <h1>Capibara Games</h1>
                <div class="divider"></div>
                <p class="lead">Estamos construyendo una nueva experiencia.</p>
                <p>Nuestro sitio web está bajo construcción. Vuelve muy pronto.</p>
            </div>
        </div>
    </div>
</body>
</html>
