name: 🚀 Despliegue a Hostgator

# Se ejecuta solo manualmente
on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obtener el código más reciente
      uses: actions/checkout@v4

    - name: 📦 Instalar dependencias PHP
      run: composer install --no-dev --optimize-autoloader
    
    - name: 📂 Sincronizar archivos con Hostgator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        
        # Destino en el servidor
        server-dir: ./public_html/
        
        # --- FILTRO DE SEGURIDAD ---
        # Esto asegura que NO subas basura ni archivos sensibles
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/node_modules/**
          README.md
          CHANGELOG.md
          LICENSE
          composer.json
          composer.lock
          package.json
          package-lock.json
          .env
          .env.local
          .env.example