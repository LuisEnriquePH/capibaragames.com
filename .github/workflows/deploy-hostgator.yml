name: 🚀 Despliegue Temporal (Landing Page)

# Se ejecuta solo manualmente
on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obtener el código más reciente
      uses: actions/checkout@v4
    
    - name: 📂 Sincronizar archivos con Hostgator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        
        # --- TRUCO TEMPORAL ---
        # Esto le dice: "Solo sube lo que hay dentro de landing_temp"
        # De esta forma, el index.html de esa carpeta se convertirá en tu página principal.
        local-dir: ./landing_temp/
        
        # Destino en el servidor
        server-dir: ./public_html/
        
        # --- FILTRO DE SEGURIDAD ---
        # Aunque usamos local-dir, dejamos esto por seguridad para el futuro
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/node_modules/**
          README.md
          CHANGELOG.md
          LICENSE
          composer.json
          composer.lock
          package.json
          package-lock.json
          .env
          .env.local